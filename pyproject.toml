[project]
name = "lecture-notes"
version = "0.6.1"
description = "CLI tool to turn lecture recordings and transcripts into speaker-aware Markdown notes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0.0,<3",
]

[project.optional-dependencies]
audio = [
    "whispermlx==3.13.1",
    # WhisperMLX requires Torch 2.8; TorchCodec 0.7 is its newest compatible series.
    "torchcodec>=0.7,<0.8",
]

[project.scripts]
lecture-notes = "lecture_notes.cli:main"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
